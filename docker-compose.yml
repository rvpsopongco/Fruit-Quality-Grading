version: '3.8' 
services: 
  backend: 
    build: . 
    container_name: fruit_grading_backend 
    ports: 
      - "8000:8000" 
    volumes: 
      - ./models:/app/models 
    environment: 
      - MODEL_PATH=models/fruit_model.onnx 
      - LOG_LEVEL=info 
    restart: unless-stopped 
